name: Whisper Model Ferry

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ferry:
    runs-on: ubuntu-latest

    steps:
      - name: Download medium.en q5 model from Hugging Face
        run: |
          set -euxo pipefail
          curl -L --fail --retry 5 --retry-delay 5 \
            -o ggml-medium.en-q5_0.bin \
            https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-medium.en-q5_0.bin

          ls -lh ggml-medium.en-q5_0.bin
          sha256sum ggml-medium.en-q5_0.bin

      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: ggml-medium.en-q5_0
          path: ggml-medium.en-q5_0.bin
          retention-days: 1
          compression-level: 6
