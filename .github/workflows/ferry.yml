name: Whisper Model Ferry

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ferry:
    runs-on: ubuntu-latest

    steps:
      - name: Download base.en q5 model from Hugging Face
        run: |
          set -euxo pipefail

          curl -L --fail --retry 5 --retry-delay 5 \
            -o ggml-base.en-q5_1.bin \
            https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.en-q5_1.bin

          ls -lh ggml-base.en-q5_1.bin
          sha256sum ggml-base.en-q5_1.bin

      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: ggml-base.en-q5_1
          path: ggml-base.en-q5_1.bin
          retention-days: 1
          compression-level: 6
