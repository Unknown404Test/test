name: Tiny GPT-2 Model Ferry

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tiny-gpt2-ferry.yml"

jobs:
  ferry:
    runs-on: ubuntu-latest

    steps:
      - name: Download tiny-gpt2 from Hugging Face
        run: |
          set -euxo pipefail
          mkdir -p tiny-gpt2
          base="https://huggingface.co/sshleifer/tiny-gpt2/resolve/main"

          for f in \
            config.json \
            pytorch_model.bin \
            vocab.json \
            merges.txt \
            tokenizer_config.json \
            special_tokens_map.json
          do
            curl -L --fail --retry 5 --retry-delay 5 \
              -o "tiny-gpt2/$f" \
              "$base/$f"
          done

          find tiny-gpt2 -maxdepth 1 -type f -printf '%f  %s bytes\n' | sort
          sha256sum tiny-gpt2/*

      - name: Upload tiny-gpt2 artifact
        uses: actions/upload-artifact@v4
        with:
          name: tiny-gpt2
          path: tiny-gpt2/
          retention-days: 1
          compression-level: 6
